# Builds the Docker image and pushes it to GitHub Container Registry, each
# platform on its own native runner (Docker's github-builder workflow).
# - Tag v1.2.3 → ghcr.io/<owner>/orcanva:1.2.3, :1.2, :1 and :latest
# - Push to main → :main and :sha-<short sha>
# - Pull request → builds only, pushes nothing
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: docker/github-builder/.github/workflows/build.yml@v1.18.1
    permissions:
      contents: read
      # Signs the image's attestations with GitHub's OIDC token
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
        type=ref,event=branch
        type=ref,event=pr
        type=sha
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
