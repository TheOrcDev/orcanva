<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Placeholder watercolor sunset for the landing hero. Its colours belong
       to the artwork only, never to the UI. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede8"/>
      <stop offset="0.3" stop-color="#f7e0d2"/>
      <stop offset="0.5" stop-color="#f5c7ae"/>
      <stop offset="0.62" stop-color="#ef9f80"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="590" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3dc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fcd5a9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7c4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a2b0"/>
      <stop offset="1" stop-color="#ddb8b8"/>
    </linearGradient>
    <linearGradient id="near-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9f7f99"/>
      <stop offset="1" stop-color="#b8929c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ae94"/>
      <stop offset="0.45" stop-color="#ecc4b4"/>
      <stop offset="1" stop-color="#dccbc4"/>
    </linearGradient>
    <radialGradient id="reflection" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4de" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4de" stop-opacity="0"/>
    </radialGradient>
    <!-- Wobbles hard edges like pigment bleeding into wet paper -->
    <filter id="wash" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0 0.22  0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="420" cy="250" rx="230" ry="32" fill="#fbebe2"/>
    <ellipse cx="1190" cy="196" rx="270" ry="28" fill="#fbe8dd"/>
    <ellipse cx="990" cy="330" rx="170" ry="20" fill="#f9d5c2"/>
    <ellipse cx="300" cy="400" rx="190" ry="18" fill="#f8d2bd"/>
  </g>
  <!-- The scene sits low so the headline stack stays in open sky -->
  <g transform="translate(0 40)">
    <rect width="1600" height="1000" fill="url(#glow)"/>
    <circle cx="800" cy="584" r="40" fill="#fff4df" opacity="0.92"/>

    <g filter="url(#wash)">
      <path d="M-40 640 L-40 450 C70 430 190 380 290 392 C380 403 440 450 520 475 C590 498 640 540 720 560 C770 572 830 572 880 558 C960 536 1010 490 1090 460 C1170 430 1230 380 1320 372 C1410 365 1500 410 1640 425 L1640 640 Z" fill="url(#far-ridge)" opacity="0.9"/>
      <path d="M-40 640 L-40 520 C80 506 150 490 230 502 C320 516 380 550 460 576 C540 602 620 610 700 614 L900 614 C980 610 1060 598 1140 574 C1220 550 1290 512 1380 504 C1460 498 1540 510 1640 518 L1640 640 Z" fill="url(#near-ridge)"/>
    </g>

    <rect y="616" width="1600" height="200" fill="url(#water)"/>
    <ellipse cx="800" cy="668" rx="70" ry="100" fill="url(#reflection)"/>
    <g fill="#fff6ea" opacity="0.4">
      <rect x="640" y="640" width="320" height="3" rx="1.5"/>
      <rect x="560" y="668" width="180" height="2" rx="1"/>
      <rect x="860" y="684" width="240" height="2" rx="1"/>
      <rect x="700" y="706" width="200" height="2" rx="1"/>
      <rect x="380" y="724" width="140" height="2" rx="1"/>
      <rect x="1080" y="736" width="170" height="2" rx="1"/>
    </g>

    <g filter="url(#wash)">
      <path d="M-40 1040 L-40 750 C160 716 330 728 480 750 C600 768 700 776 820 768 C980 756 1120 724 1280 728 C1420 732 1520 746 1640 740 L1640 1040 Z" fill="#b6c39b"/>
      <path d="M-40 1040 L-40 820 C180 790 360 810 540 838 C700 862 860 866 1020 846 C1180 826 1360 800 1640 812 L1640 1040 Z" fill="#9db084"/>
    </g>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.3" style="mix-blend-mode:multiply"/>
</svg>
