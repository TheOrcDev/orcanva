  <path d="M7 16a9 9 0 0 1 18 0z" fill="#f19b89"/>
  <path d="M10 10l4 1v1a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM22 10l-4 1v1a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z" fill="#1f1322"/>
  <path d="M10 16c-.2-.8-.2-1.5 0-2.4 1.2.5 2.1 1.3 2.5 2.4zM22 16c.2-.8.2-1.5 0-2.4-1.2.5-2.1 1.3-2.5 2.4z" fill="#fef4e5"/>
  <rect class="horizon" x="4" y="16" width="24" height="2" rx="1"/>
